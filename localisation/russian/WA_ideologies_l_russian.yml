progressivism: "Прогрессивизм"
progressivism_noun: "Прогрессивизм"
progressivism_desc: "Прогрессивная"

    ######################
    #    SUBIDEOLOGIES   #
    ######################

progressivism_subtype: "Прогрессивизм"
transhumanism: "Трансгуманизм"
technocracy: "Технократия"

progressivism_subtype_desc: "Прогрессивизм — это приверженность идеям непрерывного развития и совершенствования общества, воспринимаемых как неоспоримая истина, ведущая к абсолютному благу человечества. Сторонники стремятся к повсеместному внедрению реформ во все сферы жизни, от политики до культуры, утверждая необходимость разрыва с устаревшими традициями ради «правильного» будущего. Они желают видеть плановую экономику с сильным государственным регулированием. Взгляд на мир строится на вере в прогресс как высшую цель, где наука и социальная справедливость очищают общество от «чуждых» пережитков прошлого. Противники же видят в этом слепую одержимость новизной, жертвенность настоящего ради утопий и подмену свободы народа волей элит, навязывающих свои идеалы под видом всеобщего спасения."
transhumanism_desc: "Трансгуманизм стремится пересечь границы человеческого существования, объединяя биологию с передовыми технологиями для создания общества, где пределы тела и разума преодолены. Это движение возглавляют визионеры, выступающие последним голосом в вопросах эволюции вида, вооруженные искусственным интеллектом, генной инженерией и кибернетикой. Сторонники утверждают, что это необходимо для выживания человечества в эпоху космических вызовов и экологических кризисов, обещая утопию вечной жизни и сверхразума. Однако противники видят в этом извращение естественного порядка: воля масс подчинена техноэлите, а безграничная власть тех, кто управляет машинами, рождает новых тиранов. Вместо свободы трансгуманизм, по их мнению, грозит превратить человека в инструмент собственных амбиций, стирая грань между живым и механическим."
technocracy_desc: "Технократия — идеология, нацеленная на управление обществом через научный прогресс и экспертизу вместо политических страстей. Существуют её формы: от утопий, где технологии служат равенству, до элитарных, где власть сосредоточена у инженеров и учёных. Объединяет их вера в рациональность и эффективность как путь к "совершенному" порядку. Критики видят угрозу в отрыве от человеческих ценностей и подмене демократии технической диктатурой. Некоторые теории опираются на идеи Просвещения, отрицая хаос традиций ради "управляемого будущего". Технократия — не единая доктрина, а набор взглядов: от мягких реформ до радикальных экспериментов с обществом. Обобщать её сложно: она обещает порядок, но рискует привести к холодной бесчеловечности управления."