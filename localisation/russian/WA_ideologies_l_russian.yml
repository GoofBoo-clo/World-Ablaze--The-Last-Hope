#                 NAZI                 #
########################################

nazi: "Национал-Социализм"
nazi_noun: "Национал-Социализм"
nazi_desc: "Тоталитарный, рассовая теория"

######################
#    SUBIDEOLOGIES   #
######################

nazi_subtype: "Нацизм"

nazi_subtype_desc: "Нацизм - это ядовитое варево из воз-\r\nрожденного фашистского пыла и безумного\r\nрасового превосходства, боготворящее ис-\r\nкаженное видение арийской чистоты превы-\r\nше всего. Движимые бешеной ненавистью к\r\nевреям, меньшинствам и «дегенератам»,\r\nони стремятся очистить общество от\r\n«неполноценных» элементов с помощью на-\r\nсилия и запугивания. Неонацисты фетишизи-\r\nруют милитаризм и авторитарный контроль,\r\nмечтая о тоталитарном государстве, где\r\nинакомыслие подавляется и господствует\r\n«главная раса». Они цепляются за искажен-\r\nную историю, прославляя Третий рейх и\r\nраздувая конспирологическую пропаганду\r\nдля подпитки своего дела. Свастика стано-\r\nвится их нечестивым знаменем, а грубая\r\nсила - их евангелием. Критики называют\r\nеё ненормальным реликтом, процветающим\r\nна паранойе и расколе, а ее последовате-\r\nли наслаждаются хаосом, преследуя бредо-\r\nвую утопию, построенную на крови и\r\nруинах."

########################################
#              CONSERVATISM            #
########################################

conservatism: "Консерватизм"
conservatism_noun: "Консерватизм"
conservatism_desc: "Демократический"

######################
#    SUBIDEOLOGIES   #
######################

conservatism_subtype: "Консерватизм"
neoconservatism: "Неоконсерватизм"
traditionalism: "Традиционализм"
liberal_conservatism: "Либеральный Консерватизм"
teocracy: "Теократия"
statism: "Статизм"

conservatism_subtype_desc: "Консерватизм — это идеология, ценящая\r\nстабильность, традиции и постепенные\r\nизменения вместо радикальных реформ.\r\nКонсерваторы считают, что общество долж-\r\nно опираться на проверенные временем\r\nинституты — семью, религию, государст-\r\nво, — которые обеспечивают порядок и\r\nмораль. Они скептически относятся к\r\nутопиям и абстрактным теориям, предпочи-\r\nтая прагматизм и сохранение существующе-\r\nго. Экономически консерватизм может\r\nподдерживать свободный рынок, но с ак-\r\nцентом на защиту национальных интересов.\r\nСоциально он часто выступает за сохране-\r\nние культурной идентичности и против\r\nбыстрой модернизации. Мыслители вроде\r\nЭдмунда Бёрка подчеркивали важность эво-\r\nлюционного развития.\n\n	  Критики видят в консерватизме сопро-\r\nтивление прогрессу, а сторонники —\r\nзащиту от хаоса и утраты ценностей."
neoconservatism_desc: "Неоконсерватизм — это идеология, возник-\r\nшая в XX веке, сочетающая консервативные\r\nценности с активной внешней политикой и\r\nверой в распространение демократии. Нео-\r\nконсерваторы выступают за сильное госу-\r\nдарство, способное защищать национальные\r\nинтересы и продвигать либеральные идеалы\r\nза рубежом, нередко через военное вмеша-\r\nтельство. Они поддерживают свободный\r\nрынок, но допускают вмешательство госу-\r\nдарства для обеспечения стабильности.\r\nИдеология отвергает изоляционизм, считая,\r\nчто мир и безопасность требуют глобаль-\r\nного лидерства, особенно со стороны США.\r\n	Неоконсерваторы часто критикуют мульти-\r\nкультурализм и подчеркивают важность\r\nтрадиционных ценностей, таких как семья\r\nи мораль. Их подход сочетает прагматизм\r\nс идеализмом, что вызывает споры:\r\nсторонники видят в этом силу,\r\nпротивники — агрессию и утопизм."
traditionalism_desc: "Традиционализм — это идеология, основан-\r\nная на почитании прошлого, традиций и\r\nустоев как источника мудрости и стабиль-\r\nности. Традиционалисты считают, что\r\nсовременность с её прогрессом, индивиду-\r\nализмом и секуляризацией разрушает\r\nпроверенные временем ценности: семью,\r\nрелигию, общинность. Они выступают за\r\nсохранение иерархий, авторитетов и куль-\r\nтурного наследия, часто идеализируя\r\nдоиндустриальное общество.\r\nТрадиционализм отвергает либеральные\r\nидеи равенства и перемен ради самих\r\nперемен, видя в них угрозу порядку.\r\nФилософы вроде Рене Генона и Юлиуса\r\nЭволы связывали его с метафизическими\r\nпринципами и духовностью.\n\n	  Критики обвиняют традиционализм в\r\nретроградности и неспособности адаптиро-\r\nваться, тогда как сторонники видят в нём\r\nзащиту от хаоса современности."
liberal_conservatism_desc: "Либеральный консерватизм — это идеология,\r\nсочетающая либеральные и консервативные\r\nпринципы, стремясь к балансу между сво-\r\nбодой и традициями. Она поддерживает\r\nиндивидуальные права, рыночную экономику\r\nи ограниченное государство — черты либе-\r\nрализма, — но при этом ценит стабиль-\r\nность, моральные устои и культурное\r\nнаследие, характерные для консерватизма.\r\nЛиберал-консерваторы выступают за посте-\r\nпенные реформы, избегая радикализма, и\r\nсчитают, что свобода должна сопровожда-\r\nться ответственностью и уважением к\r\nпорядку. Эта идеология часто ассоцииру-\r\nется с умеренными политическими партиями,\r\nтакими как британские тори XIX века.\n\n      Критики обвиняют её в непоследова-\r\nтельности или компромиссности, а сторон-\r\nники видят в ней разумный синтез, позво-\r\nляющий адаптироваться к современности\r\nбез утраты корней."
teocracy_desc: "Теократия — это идеология и форма прав-\r\nления, при которой власть принадлежит\r\nрелигиозным лидерам, а государственные\r\nзаконы основаны на священных текстах или\r\nбожественных заповедях. Теократы счита-\r\nют, что общество должно жить по воле\r\nБога, интерпретируемой духовенством, а\r\nсветская власть подчинена религиозной.\r\nЭта система отвергает разделение церкви\r\nи государства, видя в религии источник\r\nморали и порядка. Примеры — исторические\r\nпапские государства или современный Иран\r\nс его исламской республикой. Теократия\r\nподчеркивает духовное единство, но часто\r\nограничивает личные свободы и плюрализм,\r\nтребуя подчинения догмам.\n\n      Критики считают её репрессивной и\r\nустаревшей, тогда как сторонники видят в\r\nней путь к праведной жизни и защите от\r\nсекулярного упадка."
statism_desc: "Статизм — это идеология, утверждающая\r\nглавенство государства над всеми аспек-\r\nтами жизни общества. Она считает государ-\r\nство высшим авторитетом, ответственным\r\nза регулирование экономики, культуры,\r\nобразования и даже личных свобод ради\r\nобщего блага или национальных целей.\r\nСтатисты видят в сильной централизованной\r\nвласти способ обеспечить порядок, безо-\r\nпасность и прогресс, отвергая чрезмерный\r\nиндивидуализм или рыночный хаос. Граждане\r\nвоспринимаются как часть коллективного\r\nорганизма, подчиненного интересам госу-\r\nдарства. Идеология может сочетаться с\r\nразными системами — от социализма до ав-\r\nторитаризма. Критики обвиняют статизм в\r\nудушении свобод и создании бюрократии,\r\nприводящей к неэффективности. Сторонники\r\nсчитают его необходимым для защиты об-\r\nщества от распада и внешних угроз в\r\nэпоху нестабильности."

########################################
#               DESPOTISM              #
########################################

despotism: "Деспотизм"
despotism_noun: "Деспотизм"
despotism_desc: "Тоталитарный"

######################
#    SUBIDEOLOGIES   #
######################

despotism_subtype: "Деспотизм"
totalism: "Тотализм"
fundamentalism: "Фундаментализм"

despotism_subtype_desc: "Деспотизм — это идеология и форма прав-\r\nления, при которой власть одного лица или\r\nгруппы осуществляется произвольно, без\r\nоглядки на законы или волю народа. Она\r\nхарактеризуется абсолютным подчинением\r\nобщества правителю, чья воля становится\r\nединственным источником решений. Деспо-\r\nтизм подавляет свободы, используя страх,\r\nнасилие и подкуп для поддержания контро-\r\nля. Экономика и ресурсы часто служат\r\nобогащению элиты, а не благу общества.\r\nИдеология может опираться на традицию,\r\nрелигию или миф о необходимости сильной\r\nруки для порядка. Отличие от других ав\r\nторитарных систем — в отсутствии даже\r\nформальных ограничений власти.\n\n     Критики видят в деспотизме тиранию\r\nи несправедливость, тогда как сторонники\r\nсчитают его способом избежать анархии и\r\nобеспечить единство в сложные времена."
totalism_desc: "Тотализм — это яростная доктрина, где\r\nгосударство становится всепоглощающей\r\nсилой, подавляющей личную волю ради един-\r\nства и мощи. Здесь нет места слабости:\r\nконтроль пронизывает все — от умов до\r\nтел, возводя порядок в абсолют. Тоталисты\r\nжаждут централизованной экономики, где\r\nресурсы служат величию системы, а не ин-\r\nдивиду. Их взгляд на мир — поле битвы,\r\nгде только сильнейшие выживают, а инако-\r\nмыслие выжигается как зараза. Они воспе-\r\nвают прошлое, когда железная рука правила\r\nбез оглядки, и презирают «разложение»\r\nсвобод. Армия и пропаганда — их оружие\r\nдля построения монолита, где каждый —\r\nвинтик машины. Движимые мечтой о вечной\r\nвласти, они клеймят врагов как угрозу\r\nделу, но критики видят в этом лишь тира-\r\nнию, где человек растворяется в безликой\r\nмассе, а жизнь — в служении идолу госу-\r\nдарства."
fundamentalism_desc: "Фундаментализм — это приверженность к\r\nкомплексу идей и ценностей, воспринимаемых\r\nкак незыблемые и являющиеся абсолютной\r\nистиной вне зависимости от их содержания.\r\nЭти принципы используются социальными\r\nгруппами и движениями, которые называются\r\nфундаменталистскими, стремящихся к\r\nповсеместному распространению во всех\r\nсферах социума, включая политику.\r\nОсновополагающим мотивом фундаментализма\r\nявляется стремление к возвращению в некое \r\nизначальное «правильное» состояние,\r\nвосстановлению «утраченной подлинности»\r\nкультуры или уклада, в той интерпретации, в\r\nкоторой представляет это изначальное\r\nположение конкретное течение.\r\nФундаменталистскими являются течения\r\nмысли, религиозные и светские, ратующие за\r\n«чистоту» своих идей и политических планов,\r\nих «защиту» от возникших в ходе истории\r\n«чуждых», в их понимании, элементов."

