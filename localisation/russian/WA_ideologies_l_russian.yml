communist: "Коммунизм"
communist_noun: "Коммунизм"
communist_desc: "Коммунистический"

    ######################
    #    SUBIDEOLOGIES   #
    ######################

communist_subtype: "Коммунизм"
agrarianism: "Аграризм"
stratocratic_communism: "Стратократический Коммунизм"
syndicalism: "Синдикализм"
anarcho_communism: "Анархо-Коммунизм"

communist_subtype_desc: "Коммунизм — это идеология, обещающая бесклассовое общество, где частная собственность уступает место коллективному владению, а труд каждого служит благу всех. Она требует плановую экономику, управляемую государством для равного распределения ресурсов. Взгляд на мир строится на вере в неизбежный крах капитализма, порождающего угнетение, и в революцию как единственный путь к освобождению масс. Сторонники видят в этом высшую справедливость, где исчезают эксплуатация и неравенство, а человечество достигает гармонии. Противники же утверждают, что такие идеи утопичны, а на деле оборачиваются тоталитаризмом, подавлением свободы и экономической стагнацией, где власть элиты заменяет обещанное равенство, а мечты о братстве тонут в бюрократии и насилии."
agrarianism_desc: "Аграризм — это идеология, ставящая в центр сельскую жизнь, земледелие и крестьянский уклад как основу общества. Аграристы считают, что сельское хозяйство не только обеспечивает экономическую стабильность, но и формирует моральные ценности: трудолюбие, простоту, связь с природой. Они выступают против индустриализации и урбанизации, видя в них угрозу традиционному образу жизни и окружающей среде. Аграризм часто связан с идеей самообеспечения общин, децентрализации власти и защиты прав фермеров. Идеология подчеркивает важность земли как источника богатства и свободы, отвергая чрезмерную зависимость от технологий и глобальных рынков. Критики аграризма указывают на его романтизацию прошлого и непрактичность в современном мире, тогда как сторонники видят в нем путь к устойчивости и гармонии."
stratocratic_communism_desc: "Стратократический Коммунизм — это приверженность идее равенства, воплощенной через железную власть военной элиты, воспринимаемой как незыблемый страж абсолютной справедливости. Это течение стремится к повсеместному утверждению коммунистических идеалов, где армия становится ядром общества, а дисциплина — высшей ценностью. Его мотив — возвращение к «правильному» порядку, где нет места буржуазным излишествам, а ресурсы распределяются под контролем солдатских советов. Сторонники видят в этом «чистоту» революции, защиту от капиталистических «чуждых» элементов, угрожающих коллективу. Критики же считают, что милитаризация душит свободу, превращая народ в инструмент военных вождей, а мечта о равенстве тонет в культе силы и подчинения, далеком от подлинного братства."
syndicalism_desc: "Синдикализм — идеология, что грезит о мире, где рабочие, сжав кулаки, сами держат руль судьбы. Это не хаос анархии, а строй, где профсоюзы — сердце власти, заменяют государство и капитал. Через забастовки и солидарность они рвут цепи эксплуатации, строя общество равных. Корни его — в горниле труда XIX века, где пот и кровь рабочих питали мечту о свободе. Сторонники видят в нём новое общество, что сметает хозяев и бюрократов ради прямого народного контроля. Критики же шипят: утопия обернётся тиранией профсоюзных вождей, что мало чем лучше старых царей. Синдикализм — не монолит, а пламя, что то тлеет в реформах, то полыхает в революциях. Он требует веры в массы, но пугает хаосом распада. Это вызов элитам и гимн самоуправлению, где власть — не дар свыше, а право, вырванное борьбой. Синдикализм многолик, как и сам труд."
anarcho_communism_desc: "Анархо-Коммунизм — это приверженность к идеалам свободы и равенства, воспринимаемых как абсолютная истина вне зависимости от условий. Его принципы воплощаются социальными группами, стремящимися к полному упразднению государства и частной собственности ради коллективного управления. Основной мотив анархо-коммунизма — возвращение к естественному состоянию общества, где нет иерархий и угнетения, в интерпретации, видящей капитализм как чуждый элемент истории. Анархо-коммунистические течения мысли ратуют за чистоту своих идей, отвергая компромиссы с властью и рынком, и защищают их от любых форм государственного или буржуазного влияния. Это стремление к подлинности делает их радикальными в борьбе за бесклассовое будущее, свободное от эксплуатации."

