#           AUTHORITARIANISM           #
########################################

authoritarianism: "Авторитаризм"
authoritarianism_noun: "Авторитаризм"
authoritarianism_desc: "Авторитарный"

    ######################
    #    SUBIDEOLOGIES   #
    ######################

authoritarianism_subtype: "Авторитаризм"
autocracy: "Автократия"
dictatorship: "Диктатура"
monarchy: "Монархия"
military_junta: "Военная Хунта"
stratocracy: "Стратократия"
semi_constitut_monarchy: "Полуконституционная Монархия"
democracies: "Демократура"
oligarchy: "Олигархия"
social_monarchism: "Социал-Монархизм"

authoritarianism_subtype_desc: "Авторитаризм — это идеология, утверждающая необходимость сильной централизованной власти для управления обществом и поддержания порядка. Она отвергает либеральные свободы и демократический плюрализм, считая их источником хаоса, и ставит стабильность выше прав личности. Власть сосредотачивается в руках узкой элиты или лидера, контролирующих политику, экономику и культуру через принуждение и пропаганду. Авторитаризм требует подчинения граждан государственным интересам, часто оправдывая это защитой от внешних угроз или внутренних раздоров. Оппозиция подавляется, а инакомыслие считается опасным. Критики обвиняют авторитаризм в репрессиях и ущемлении свобод, видя в нем путь к тирании. Сторонники считают его эффективным средством для быстрого развития и сохранения единства в условиях кризиса."
autocracy_desc: "Автократия — это идеология и форма правления, при которой вся власть сосредоточена в руках одного лица или узкой группы, не ограниченных законами или народным волеизъявлением. Она подчеркивает абсолютный контроль, где решения принимаются централизованно, а оппозиция подавляется. Автократия ценит стабильность и порядок выше свободы и плюрализма, считая, что сильная власть необходима для управления обществом и защиты его от хаоса. Экономика и социальная жизнь подчиняются воле правителя, будь то через государственный контроль или личные интересы элиты. Идеология часто оправдывается традициями, религией или национальной миссией.Критики видят в ней тиранию и ущемление прав, тогда как сторонники считают её эффективной в кризисах и способом избежать раздробленности."
dictatorship_desc: "Диктатура — это идеология и система правления, где власть сосредоточена в руках одного лица или небольшой группы, подавляющих любые формы инакомыслия. Она отвергает демократические принципы, заменяя их строгим контролем и принуждением. Диктатура стремится к абсолютному подчинению общества, используя пропаганду, страх и репрессии для поддержания порядка. Экономика, культура и политика подстраиваются под цели правящей силы, часто игнорируя права граждан. Идеология может оправдываться необходимостью единства, защиты от внешних угроз или восстановления величия нации. Критики считают диктатуру угнетающей и бесчеловечной, указывая на утрату свобод и коррупцию. Сторонники видят в ней способ быстро решать проблемы и обеспечивать стабильность в условиях кризиса или слабости общества."
monarchy_desc: "Монархизм — это идеология, поддерживающая монархию как форму правления, где власть сосредоточена в руках наследственного правителя — короля, царя или императора. Монархисты считают, что монархия обеспечивает стабильность, преемственность и единство нации, воплощая её исторические традиции и ценности. Они видят в монархе символ нации, стоящий выше политических распрей и партийных интересов. Монархизм часто связан с идеями порядка, иерархии и божественного права правителя, особенно в абсолютных формах. В конституционных монархиях акцент смещается на символическую роль монарха при демократическом управлении. 	Критики считают монархизм устаревшим и недемократичным, тогда как сторонники ценят его способность сплачивать общество и сохранять культурную идентичность."
military_junta_desc: "Военная Хунта — это идеология и форма правления, при которой власть захватывается и удерживается группой военных, обычно через переворот. Она ставит военную дисциплину и силу выше гражданских институтов, считая армию главным гарантом порядка и безопасности. Хунта подавляет политическую оппозицию, ограничивает свободы и использует репрессии для контроля общества. Экономика часто подчиняется нуждам военных, а национальная риторика оправдывает их действия защитой от внутренних или внешних угроз. Идеология не признает демократию, видя в ней слабость, и опирается на иерархию и лояльность внутри армии. Критики считают хунту жестокой и антинародной, указывая на коррупцию и насилие. Сторонники видят в ней временную меру для стабилизации в условиях хаоса или кризиса."
stratocracy_desc: "Стратократия — это идеология и форма правления, при которой государство управляется военными, а армия становится его основой и движущей силой. Она провозглашает военную дисциплину и силу высшими ценностями, считая их залогом порядка и безопасности. Власть сосредоточена в руках офицеров или военного совета, а гражданские институты подчинены или вовсе упразднены. Экономика и общество ориентированы на поддержку военных нужд, а граждане часто вовлечены в милитаризованную жизнь. Стратократия отвергает демократию, видя в ней слабость, и ставит долг перед нацией выше личных свобод. Критики считают её гнетущей и бесчеловечной, указывая на подавление прав и милитаризацию культуры. Сторонники видят в ней способ обеспечить единство и защиту от внутренних и внешних угроз в эпоху нестабильности."
semi_constitut_monarchy_desc: "Полуконституционная Монархия — это идеология и форма правления, при которой монарх сохраняет значительную власть, но действует в рамках частично ограниченной конституции. Она сочетает традиционную роль монарха как символа нации и источника авторитета с элементами представительного управления, такими как парламент. Монарх может влиять на законы, назначать чиновников или вмешиваться в политику, но его полномочия формально очерчены, хотя часто остаются шире, чем в чисто символических монархиях. Идеология ценит стабильность и преемственность, опираясь на историческое наследие. Критики видят в ней компромисс, ведущий к конфликтам между монархом и народом, а также к недостаточной демократии. Сторонники считают её способом сохранить традиции, добавив гибкости для адаптации к современным вызовам."
democracies_desc: "Демократура — это идеология и система, маскирующая авторитарное правление под демократические формы. Она сохраняет внешние атрибуты демократии — выборы, партии, конституцию, — но на деле власть сосредоточена в руках узкой группы, манипулирующей процессами. Свободы граждан ограничены, СМИ подконтрольны, а оппозиция ослаблена или подавлена через законы и давление. Демократура стремится к стабильности и контролю, избегая открытого насилия, но используя бюрократию и пропаганду для легитимации. Идеология оправдывает себя необходимостью порядка и «защиты от врагов». Критики видят в ней лицемерие и подрыв истинной демократии, указывая на эрозию прав и фиктивность участия народа. Сторонники считают её компромиссом, позволяющим сочетать управление с иллюзией свободы в сложных условиях."
oligarchy_desc: "Олигархия — идеология, воспевающая власть избранных, где элита, обладая богатством и влиянием, правит обществом, оттесняя массы на обочину. Это не просто строй, а философия неравенства, где сильные процветают, а слабые служат. Одни видят в ней порядок и стабильность, другие — гниль привилегий и угнетение. Олигархия питается контролем ресурсов и знаний, создавая иллюзию естественного отбора. Её корни уходят в древние полисы, но цветёт она и в наши дни, маскируясь под демократию или рынок. Критики кричат о несправедливости, о разрыве между «верхами» и «низами», о коррупции как топливе системы. Сторонники же шепчут о необходимости твёрдой руки и железного закона олигархии элит для прогресса. Олигархия — не монолит, а зеркало человеческих амбиций, где власть — и цель, и проклятье. Обобщать опасно: она многолика, как сама природа человека."
social_monarchism_desc: "Социал-Монархизм — это приверженность к идее абсолютной монархической власти, основанной на социальной справедливости и традициях, воспринимаемых как незыблемые и истинные вне зависимости от эпохи. Эти принципы используются группами, стремящимися к восстановлению «правильного» порядка, где монарх выступает гарантом благосостояния народа и защитником его исторической идентичности. Основополагающим мотивом социал-монархизма является возвращение к утраченной «золотой эре» гармонии между властью и обществом, в той интерпретации, которую предлагают его сторонники. Социал-монархистскими являются течения, ратующие за «чистоту» традиций и защиту их от либеральных или революционных влияний, считая их чуждыми и разрушительными для подлинного уклада жизни, сложившегося в прошлом."

