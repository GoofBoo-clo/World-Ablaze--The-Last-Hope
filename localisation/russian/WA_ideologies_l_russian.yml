despotism: "Деспотизм"
despotism_noun: "Деспотизм"
despotism_desc: "Деспотистический"

    ######################
    #    SUBIDEOLOGIES   #
    ######################

despotism_subtype: "Деспотизм"
totalism: "Тотализм"
fundamentalism: "Фундаментализм"

despotism_subtype_desc: "Деспотизм — это идеология и форма правления, при которой власть одного лица или группы осуществляется произвольно, без оглядки на законы или волю народа. Она характеризуется абсолютным подчинением общества правителю, чья воля становится единственным источником решений. Деспотизм подавляет свободы, используя страх, насилие и подкуп для поддержания контроля. Экономика и ресурсы часто служат обогащению элиты, а не благу общества. Идеология может опираться на традицию, религию или миф о необходимости сильной руки для порядка. Отличие от других ав торитарных систем — в отсутствии даже формальных ограничений власти. Критики видят в деспотизме тиранию и несправедливость, тогда как сторонники считают его способом избежать анархии и обеспечить единство в сложные времена."
totalism_desc: "Тотализм — это яростная доктрина, где государство становится всепоглощающей силой, подавляющей личную волю ради единства и мощи. Здесь нет места слабости: контроль пронизывает все — от умов до тел, возводя порядок в абсолют. Тоталисты жаждут централизованной экономики, где ресурсы служат величию системы, а не индивиду. Их взгляд на мир — поле битвы, где только сильнейшие выживают, а инакомыслие выжигается как зараза. Они воспевают прошлое, когда железная рука правила без оглядки, и презирают «разложение» свобод. Армия и пропаганда — их оружие для построения монолита, где каждый — винтик машины. Движимые мечтой о вечной власти, они клеймят врагов как угрозу делу, но критики видят в этом лишь тиранию, где человек растворяется в безликой массе, а жизнь — в служении идолу государства."
fundamentalism_desc: "Фундаментализм — это приверженность к комплексу идей и ценностей, воспринимаемых как незыблемые и являющиеся абсолютной истиной вне зависимости от их содержания. Эти принципы используются социальными группами и движениями, которые называются фундаменталистскими, стремящихся к повсеместному распространению во всех сферах социума, включая политику. Основополагающим мотивом фундаментализма является стремление к возвращению в некоеначальное «правильное» состояние, восстановлению «утраченной подлинности» культуры или уклада, в той интерпретации, в которой представляет это изначальное положение конкретное течение. Фундаменталистскими являются течения мысли, религиозные и светские, ратующие за «чистоту» своих идей и политических планов, их «защиту» от возникших в ходе истории «чуждых», в их понимании, элементов."

