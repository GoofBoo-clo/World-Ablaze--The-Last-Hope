l_russian:

########################################
#              DEMOCRACY               #
########################################

democracy: "Демократия"
democracy_noun: "Демократия"
democracy_desc: "Демократический"

    ######################
    #    SUBIDEOLOGIES   #
    ######################

centrism: "Центризм"
solidarism: "Солидаризм"
social_democracy: "Социал-Демократия"
democracy_socialism: "Демократический Социализм"
christian_democracy: "Христианская Демократия"

centrism_desc: "Центризм — это идеология, стремящаяся занять срединную позицию между крайностями, отвергая как слепой радикализм, так и застывший консерватизм. Она выступает за сбалансированный подход, где компромисс становится инструментом управления обществом, а не слабостью. Центристы желают видеть смешанную экономику, сочетая рыночные механизмы с умеренным вмешательством государства. Их взгляд на мир строится на убеждении, что стабильность и постепенные изменения предпочтительнее резких скачков, а разнообразие мнений укрепляет социум, а не разрушает его.Критики же считают, что такая позиция часто лишена твердой основы, превращаясь в беспринципное следование за большинством, а стремление угодить всем оборачивается утратой четкой идентичности и неспособностью решать глубокие конфликты."
solidarism_desc: "Солидаризм — это приверженность идее единства общества, где гармония между классами и группами воспринимается как незыблемая истина, превосходящая индивидуальные амбиции. Сторонники солидаризма стремятся к повсеместному внедрению этого принципа во все сферы жизни, от экономики до морали, утверждая, что только через взаимопомощь и сотрудничество можно достичь подлинного процветания. Они желают видеть кооперативную экономику, основанную на коллективной ответственности. Взгляд на мир строится на возвращении к идеализированному состоянию, где эгоизм уступает общему благу, а социальная справедливость становится высшей целью. Противники же видят в этом утопию, маскирующую подавление свободы под лозунгом единства, и указывают на риск растворения личности в навязанной «общности»."
social_democracy_desc: "Социал-демократия — это идеология, стремящаяся примирить идеалы равенства и свободы через реформирование общества, избегая революционных потрясений. Она выступает за сильное государство, которое регулирует экономику и обеспечивает социальную справедливость, защищая права трудящихся и слабых. Социал-демократы желают видеть регулируемую экономику, где рынок служит обществу, а не диктует ему условия. Их взгляд на мир основан на вере в прогресс через сотрудничество классов и постепенное улучшение жизни для всех. Однако противники считают, что эта система чрезмерно полагается на бюрократию, подавляя индивидуальную инициативу, и часто жертвует эффективностью ради популистских мер. Критики также указывают, что стремление к равенству может обернуться уравниловкой, подрывающей личные достижения и амбиции."
democracy_socialism_desc: "Демократический Социализм — идеология, что мечтает о равенстве через мягкую революцию, где власть народа и социальная справедливость идут рука об руку. Это не топор радикалов, а скальпель реформ, стремящийся укротить капитализм, сохранив свободу. Его адепты верят в государство как стража общего блага: бесплатные медицина и образование, защита труда — их знамёна. Корни тянутся к Марксу, но без его суровости, смешиваясь с либеральным духом. Критики ворчат о наивности, о риске бюрократии и удушения рынка. Сторонники же видят «разрушительное творчество» в сломе старых цепей неравенства. Это не монолитный путь, а пёстрая ткань идей: от умеренных скандинавских моделей до яростных левых голосов. Демократический социализм — надежда одних и утопия других, баланс между мечтой и реальностью. Обобщать трудно: он живёт в спорах и компромиссах."
christian_democracy_desc: "Христианская Демократия — это приверженность к ценностям, основанным на христианской вере итрадициях, считаемых незыблемыми и вечными. Эти принципы применяются партиями и группами, стремящимися внедрить их в политику и социум. Главный мотив — возврат к моральному порядку, утраченному в эпоху секуляризации и либерализма, через защиту семьи, веры и общественной справедливости в их понимании «истинного пути». Христианско-демократические течения ратуют за сохранение культурной идентичности и «чистоты» нравов, противостоя чуждым, по их мнению, веяниям — атеизму, космополитизму и радикальным идеям. Они ищут баланс между свободой личности и долгом перед Богом и обществом, предлагая модель, где вера и разум сосуществуют в гармонии."

########################################
#              CONSERVATISM            #
########################################

conservatism: "Консерватизм"
conservatism_noun: "Консерватизм"
conservatism_desc: "Консервативный"

    ######################
    #    SUBIDEOLOGIES   #
    ######################

conservatism_subtype: "Консерватизм"
neoconservatism: "Неоконсерватизм"
traditionalism: "Традиционализм"
liberal_conservatism: "Либеральный Консерватизм"
teocracy: "Теократия"
statism: "Статизм"

conservatism_subtype_desc: "Консерватизм — это идеология, ценящая стабильность, традиции и постепенные изменения вместо радикальных реформ. Консерваторы считают, что общество должно опираться на проверенные временем институты — семью, религию, государство, — которые обеспечивают порядок и мораль. Они скептически относятся к утопиям и абстрактным теориям, предпочитая прагматизм и сохранение существующего. Экономически консерватизм может поддерживать свободный рынок, но с акцентом на защиту национальных интересов. Социально он часто выступает за сохранение культурной идентичности и против быстрой модернизации. Мыслители вроде Эдмунда Бёрка подчеркивали важность эволюционного развития.	Критики видят в консерватизме сопротивление прогрессу, а сторонники — защиту от хаоса и утраты ценностей."
neoconservatism_desc: "Неоконсерватизм — это идеология, возникшая в XX веке, сочетающая консервативные ценности с активной внешней политикой и верой в распространение демократии. Неоконсерваторы выступают за сильное государство, способное защищать национальные интересы и продвигать либеральные идеалы за рубежом, нередко через военное вмешательство. Они поддерживают свободный рынок, но допускают вмешательство государства для обеспечения стабильности. Идеология отвергает изоляционизм, считая, что мир и безопасность требуют глобального лидерства, особенно со стороны США. 	Неоконсерваторы часто критикуют мультикультурализм и подчеркивают важность традиционных ценностей, таких как семья и мораль. Их подход сочетает прагматизм с идеализмом, что вызывает споры: сторонники видят в этом силу, противники — агрессию и утопизм."
traditionalism_desc: "Традиционализм — это идеология, основанная на почитании прошлого, традиций и устоев как источника мудрости и стабильности. Традиционалисты считают, что современность с её прогрессом, индивидуализмом и секуляризацией разрушает проверенные временем ценности: семью, религию, общинность. Они выступают за сохранение иерархий, авторитетов и культурного наследия, часто идеализируя доиндустриальное общество. Традиционализм отвергает либеральные идеи равенства и перемен ради самих перемен, видя в них угрозу порядку. Философы вроде Рене Генона и Юлиуса Эволы связывали его с метафизическими принципами и духовностью.	Критики обвиняют традиционализм в ретроградности и неспособности адаптироваться, тогда как сторонники видят в нём защиту от хаоса современности."
liberal_conservatism_desc: "Либеральный Консерватизм — это идеология, сочетающая либеральные и консервативные принципы, стремясь к балансу между свободой и традициями. Она поддерживает индивидуальные права, рыночную экономику и ограниченное государство — черты либерализма, — но при этом ценит стабильность, моральные устои и культурное наследие, характерные для консерватизма. Либерал-консерваторы выступают за постепенные реформы, избегая радикализма, и считают, что свобода должна сопровождаться ответственностью и уважением к порядку. Эта идеология часто ассоциируется с умеренными политическими партиями, такими как британские тори XIX века.Критики обвиняют её в непоследовательности или компромиссности, а сторонники видят в ней разумный синтез, позволяющий адаптироваться к современности без утраты корней."
teocracy_desc: "Теократия — это идеология и форма правления, при которой власть принадлежит религиозным лидерам, а государственные законы основаны на священных текстах или божественных заповедях. Теократы считают, что общество должно жить по воле Бога, интерпретируемой духовенством, а светская власть подчинена религиозной. Эта система отвергает разделение церкви и государства, видя в религии источник морали и порядка. Примеры — исторические папские государства или современный Иран с его исламской республикой. Теократия подчеркивает духовное единство, но часто ограничивает личные свободы и плюрализм, требуя подчинения догмам.Критики считают её репрессивной и устаревшей, тогда как сторонники видят в ней путь к праведной жизни и защите от секулярного упадка."
statism_desc: "Статизм — это идеология, утверждающая главенство государства над всеми аспектами жизни общества. Она считает государство высшим авторитетом, ответственным за регулирование экономики, культуры, образования и даже личных свобод ради общего блага или национальных целей. Статисты видят в сильной централизованной власти способ обеспечить порядок, безопасность и прогресс, отвергая чрезмерный индивидуализм или рыночный хаос. Граждане воспринимаются как часть коллективного организма, подчиненного интересам государства. Идеология может сочетаться с разными системами — от социализма до авторитаризма. Критики обвиняют статизм в удушении свобод и создании бюрократии, приводящей к неэффективности. Сторонники считают его необходимым для защиты общества от распада и внешних угроз в эпоху нестабильности."

########################################
#              NATIONALISM             #
########################################

nationalism: "Национализм"
nationalism_noun: "Национализм"
nationalism_desc: "Националистический"

    ######################
    #    SUBIDEOLOGIES   #
    ######################

nationalism_subtype: "Национализм"
left_nationalism: "Левый Национализм"
ultranationalism: "Ультранационализм"
national_communism: "Национал-Коммунизм"
social_nationalism: "Социал-Национализм"
right_populism: "Правый Популизм"
accelerationism: "Акселерационизм"
national_bolshevism: "Национал-Большевизм"

nationalism_subtype_desc: "Национализм — это идеология, ставящая нацию, её идентичность и интересы выше других ценностей. Националисты считают, что каждая нация имеет право на самоопределение, собственное государство и сохранение своей культуры, языка и традиций. Они подчеркивают единство народа, часто противопоставляя «своих» «чужим», что может вести к патриотизму или ксенофобии. Национализм возник в XIX веке как движущая сила независимости, но его формы варьируются: от либерального, стремящегося к свободе, до агрессивного, оправдывающего экспансию. Он вдохновляет гордость за историю и достижения нации, но критикуется за потенциал к конфликтам и исключению меньшинств. Сторонники видят в нём защиту самобытности, противники — угрозу миру и универсальным ценностям."
left_nationalism_desc: "Левый национализм — это идеология, сочетающая националистические идеи с левыми принципами, такими как социальная справедливость и экономическое равенство. В отличие от правого национализма, акцентирующего традиции и исключительность, левый национализм фокусируется на защите интересов народа от внешнего угнетения — империализма, капитализма или глобализации. Он выступает за суверенитет нации, но через призму эгалитаризма, поддерживая рабочего человека и общие блага, а не элиты. Часто левый национализм связан с антиколониальными движениями и социалистическими идеями, как в случае с некоторыми латиноамериканскими или африканскими лидерами. 	Критики видят в нём противоречие между универсализмом левых и партикуляризмом национализма, а сторонники — путь к независимости и справедливости."
ultranationalism_desc: "Ультранационализм — это порочная смесьоголтелого милитаризма и пламеннойпреданности своей нации превыше всегоостального. стремясь очистить страну от«инородного влияния», ультранационалистыпродвигают автаркию, социальную сегрегациюи усиление военной мощи. Они идеализируютпрошлое, разжигая ненависть к «чужакам», ипронизывают общество расизмом идискриминацией. Армия выступает главныминструментом для достижения «великойнации», а служение государству становитсяобязательным. Движимые желанием«отомстить врагам», они стремятся к славесвоей страны, хотя конкретные проявлениямогут различаться. Однако, общимзнаменателем для всех ультра-националистических движений являетсябезудержное стремление к «вечной славе»."
national_communism_desc: "Национал-Коммунизм — это идеология, сочетающая коммунистические принципы с националистическим духом, подчеркивая независимость и самобытность нации. Она стремится к бесклассовому обществу, но делает акцент на защите национальных интересов от внешнего влияния, отвергая универсализм классического марксизма. Государство играет ключевую роль в управлении экономикой, направляя её на благо народа, а не глобальных сил. Национал-коммунисты выступают за коллективизм, но с опорой на местные традиции и культуру, часто противопоставляя себя империализму и капитализму. Идеология требует сильной власти для реализации своих целей. Критики видят в ней отступление от интернационализма и склонность к авторитаризму, тогда как сторонники считают её способом соединить социальную справедливость с национальной гордостью."
social_nationalism_desc: "Социал-Национализм — это идеология, объединяющая социалистические идеи равенства и националистическую преданность своей нации. Она стремится к построению справедливого общества с сильным государственным контролем экономики, но исключительно для «своего» народа, отвергая чужаков. Социал-националисты выступают за социальную защиту, рабочие права и национализацию ресурсов, одновременно подчеркивая превосходство национальной идентичности и культуры. Идеология часто питается ненавистью к глобализму и «иностранному влиянию», требуя изоляции или очищения общества. Она сочетает коллективизм с ксенофобией, обещая процветание только избранным. Критики видят в ней опасный гибрид, ведущий к дискриминации и агрессии, тогда как сторонники считают её способом защитить народ от эксплуатации и сохранить его уникальность."
right_populism_desc: "Правый популизм пытается объединить национальную идентичность и простонародные интересы с сильным лидером, защищающим «свой» народ от элит и внешних угроз. Сторонники этого течения утверждают, что оно необходимо для возвращения власти массам, уставшим от коррумпированных структур и глобализма, выступая за прямую волю народа через харизматичного вождя. Критики же считают, что это искажённая версия демократии: интересы «народа» подменяются волей лидера, а борьба с «врагами» — мигрантами или элитами — приводит к авторитаризму и разделению общества. Они указывают, что популизм, опираясь на эмоции масс, а не на разум, часто усиливает нетерпимость и подрывает равенство, делая лидера не слугой народа, а его новым хозяином, прикрытым лозунгами «народного суверенитета»."
accelerationism_desc: "Акселерационизм — идеология, нацеленная на ускорение исторического процесса путем разрушения существующих социальных и политических структур для создания нового, более справедливого порядка. Существуют различные его формы: от левых, ориентированных на социалистические или анархические идеалы, до правых, стремящихся к новой иерархии. Их объединяет вера в радикальные преобразования и «разрушительное творчество». Критика указывает на риски хаоса и насилия. Некоторые теории основываются на философии Ницше и идее «смерти бога», подразумевающей отказ от традиционных ценностей. Акселерационизм — это не монолитная идеология, а совокупность разнообразных и часто противоречивых взглядов, включающих как ненасильственные, так и экстремистские методы. Поэтому любые обобщения требуют осторожности."
national_bolshevism_desc: "Национал-Большевизм сочетает в себе яростный национализм с революционной тягой к социализму, возводя государство в культ. Его адепты клянутся защищать «народную» душу от чуждых сил — капитала и либералов, видя в железной дисциплине путь к славе нации. Они верят: только мощный вождь и красный кулак способны спасти страну от упадка, разжигая ненависть к «врагам» — как внешним, так и внутренним. Критики зовут это ядовитым коктейлем: за маской равенства — тоталитарный гнёт, а пламя патриотизма сжигает свободу. Сторонники же твердят, что без такого сплава нация падёт под пятой глобализма. Но противники видят тут лишь тень старых диктатур: народ — лишь топливо для милитаристской машины, а лидер — новый царь, что правит под знаменем «справедливости»."

