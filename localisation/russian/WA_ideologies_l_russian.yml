fascism: "Фашизм"
fascism_noun: "Фашизм"
fascism_desc: "Фашистский"

    ######################
    #    SUBIDEOLOGIES   #
    ######################

fascism_subtype: "Фашизм"
ultramilitarism: "Ультрамилитаризм"
esoteric_fascism: "Эзотерический Фашизм"
clerical_fascism: "Клерикальный Фашизм"

fascism_subtype_desc: "Фашизм — это авторитарная идеология, возникшая в начале XX века, ставящая государство и нацию выше личности. Фашисты, вдохновленные Муссолини, провозглашают культ сильного лидера, единство народа и подавление индивидуализма ради коллективной мощи. Они отвергают либерализм, социализм и демократию, считая их слабыми, и поддерживают милитаризм, национализм и тотальный контроль над обществом. Экономика подчиняется государству, сохраняя частную собственность, но в интересах «общего блага». Фашизм романтизирует войну как способ укрепления духа и расширения влияния. Пропаганда, цензура и культ дисциплины — его ключевые инструменты. Критики называют фашизм репрессивным и агрессивным, а сторонники видят в нём путь к порядку и величию нации в эпоху упадка."
ultramilitarism_desc: "Ультрамилитаризм — это яростный культ войны, где военная мощь становится высшей ценностью, а мир — лишь передышкой перед новым боем. Общество подчинено железной дисциплине: каждый гражданин — солдат, каждая фабрика — арсенал. Ультрамилитаристы превозносят героизм и жертвенность, видя в конфликте единственный путь к «очищению» нации. Гражданские свободы приносятся в жертву армии, а экономика служит лишь для наращивания вооружений. Враги — повсюду, и их уничтожение оправдывает любые средства. Прошлое идеализируется как череда великих побед, а будущее — как вечное поле битвы.Критики называют это безумной мясорубкой, где жизнь человека ничего не стоит, а власть генералов душит всё человеческое ради бесконечной гонки за доминированием."
esoteric_fascism_desc: "Эзотерический Фашизм — это зловещая смесь оккультной мистики и железной тирании, возносящая нацию до статуса священного культа. Превознося тайные ритуалы и «высшую судьбу», его адепты стремятся очистить общество от «духовной скверны», навязывая слепую преданность государству как божественному замыслу. Они воспевают мифическое прошлое, пропитанное эзотерическими символами, и презирают «профанов», недостойных их истины. Армия и тайные ордены становятся орудием «возрождения», а инакомыслие карается как ересь. Движимые жаждой власти и «божественной справедливости», эзотерические фашисты мечтают о величии, построенном на страхе и подчинении. Их идеалы пронизаны мракобесием и нетерпимостью, где человек —лишь пешка в руках «избранных». Общим для них остается безумное стремление к «вечному порядку», сокрытому в тенях их извращённых доктрин."
clerical_fascism_desc: "Клерофашизм — это мрачная смесь теократического рвения и фашистской тирании, нацеленная на установление «божественного порядка» через жёсткий контроль общества. Существует в разных формах: от религиозного абсолютизма до культа вождя как «посланника небес». Его адепты стремятся к очищению мира от «ереси» и инакомыслия, идеализируя прошлое и подавляя свободу. Армия и церковь сливаются в инструмент власти, а вера становится знаменем угнетения. Критики видят в этом хаос и лицемерие: вместо духовности — насилие, вместо справедливости — иерархия для избранных. Некоторые теории связывают его с идеями «священной войны», но он остаётся разнообразным: от фанатизма до прагматичных режимов. Объединяет их жажда контроля, маскируемая «волей богов», что делает клерофашизм угрозой разуму и человечности."

