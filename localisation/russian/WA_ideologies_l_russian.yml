nazi_subtype: "Нацизм"

nazi_subtype_desc: "Нацизм - это ядовитое варево из возрожденного фашистского пыла и безумного расового превосходства, боготворящее искаженное видение арийской чистоты превыше всего. Движимые бешеной ненавистью к евреям, меньшинствам и «дегенератам», они стремятся очистить общество от «неполноценных» элементов с помощью насилия и запугивания. Неонацисты фетишизируют милитаризм и авторитарный контроль, мечтая о тоталитарном государстве, где инакомыслие подавляется и господствует «главная раса». Они цепляются за искаженную историю, прославляя Третий рейх и раздувая конспирологическую пропаганду для подпитки своего дела. Свастика становится их нечестивым знаменем, а грубая сила - их евангелием. Критики называют её ненормальным реликтом, процветающим на паранойе и расколе, а ее последователи наслаждаются хаосом, преследуя бредовую утопию, построенную на крови и руинах."

