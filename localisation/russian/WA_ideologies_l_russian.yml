l_russian:

########################################
#              DEMOCRACY               #
########################################

democracy: "Демократия"
democracy_noun: "Демократия"
democracy_desc: "Демократический"

######################
#    SUBIDEOLOGIES   #
######################

centrism: "Центризм"
solidarism: "Солидаризм"
social_democracy: "Социал-Демократия"
democracy_socialism: "Демократический Социализм"
christian_democracy: "Христианская Демократия"

centrism_desc: "Центризм — это идеология, стремящаяся занять срединную позицию между крайностями, отвергая как слепой радикализм, так и застывший консерватизм. Она высту-\r\nпает за сбалансированный подход, где\r\nкомпромисс становится инструментом управ-\r\nления обществом, а не слабостью. Центрис-\r\nты желают видеть смешанную экономику,\r\nсочетая рыночные механизмы с умеренным\r\nвмешательством государства. Их взгляд на\r\nмир строится на убеждении, что стабиль-\r\nность и постепенные изменения предпочти-\r\nтельнее резких скачков, а разнообразие\r\nмнений укрепляет социум, а не разрушает\r\nего.\n\n    Критики же считают, что такая пози-\r\nция часто лишена твердой основы, превра-\r\nщаясь в беспринципное следование за\r\nбольшинством, а стремление угодить всем\r\nоборачивается утратой четкой идентичности\r\nи неспособностью решать глубокие кон-\r\nфликты."
solidarism_desc: "Солидаризм — это приверженность идее\r\nединства общества, где гармония между\r\nклассами и группами воспринимается как\r\nнезыблемая истина, превосходящая индиви-\r\nдуальные амбиции. Сторонники солидаризма\r\nстремятся к повсеместному внедрению этого\r\nпринципа во все сферы жизни, от экономи-\r\nки до морали, утверждая, что только через\r\nвзаимопомощь и сотрудничество можно дос-\r\nтичь подлинного процветания. Они желают\r\nвидеть кооперативную экономику, основан-\r\nную на коллективной ответственности.\r\nВзгляд на мир строится на возвращении к\r\nидеализированному состоянию, где эгоизм\r\nуступает общему благу, а социальная спра-\r\nведливость становится высшей целью. Про-\r\nтивники же видят в этом утопию, маскиру-\r\nющую подавление свободы под лозунгом\r\nединства, и указывают на риск растворения\r\nличности в навязанной «общности»."
social_democracy_desc: "Социал-демократия — это идеология, стре-\r\nмящаяся примирить идеалы равенства и\r\nсвободы через реформирование общества,\r\nизбегая революционных потрясений. Она\r\nвыступает за сильное государство, кото-\r\nрое регулирует экономику и обеспечивает\r\nсоциальную справедливость, защищая права\r\nтрудящихся и слабых. Социал-демократы\r\nжелают видеть регулируемую экономику,\r\nгде рынок служит обществу, а не диктует\r\nему условия. Их взгляд на мир основан на\r\nвере в прогресс через сотрудничество\r\nклассов и постепенное улучшение жизни\r\nдля всех. Однако противники считают, что\r\nэта система чрезмерно полагается на бюро-\r\nкратию, подавляя индивидуальную инициа-\r\nтиву, и часто жертвует эффективностью\r\nради популистских мер. Критики также\r\nуказывают, что стремление к равенству\r\nможет обернуться уравниловкой, подрыва-\r\nющей личные достижения и амбиции."
democracy_socialism_desc: "Демократический социализм — идеология,\r\nчто мечтает о равенстве через мягкую ре-\r\nволюцию, где власть народа и социальная\r\nсправедливость идут рука об руку. Это не\r\nтопор радикалов, а скальпель реформ,\r\nстремящийся укротить капитализм, сохранив\r\nсвободу. Его адепты верят в государство\r\nкак стража общего блага: бесплатные меди-\r\nцина и образование, защита труда — их\r\nзнамёна. Корни тянутся к Марксу, но без\r\nего суровости, смешиваясь с либеральным\r\nдухом. Критики ворчат о наивности, о рис-\r\nке бюрократии и удушения рынка. Сторон-\r\nники же видят «разрушительное творчество»\r\nв сломе старых цепей неравенства. Это не\r\nмонолитный путь, а пёстрая ткань идей:\r\nот умеренных скандинавских моделей до\r\nяростных левых голосов. Демократический\r\nсоциализм — надежда одних и утопия дру-\r\nгих, баланс между мечтой и реальностью.\r\nОбобщать трудно: он живёт в спорах и ком-\r\nпромиссах.
christian_democracy_desc: "Христианская демократия — это привержен-\r\nность к ценностям, основанным на хри-\r\nстианской вере итрадициях, считаемых не-\r\nзыблемыми и вечными. Эти принципы приме-\r\nняются партиями и группами, стремящимися\r\nвнедрить их в политику и социум. Главный\r\nмотив — возврат к моральному порядку,\r\nутраченному в эпоху секуляризации и либерализ-\r\nма, через защиту семьи, веры и общественной\r\nсправедливости в их понимании «истинного пути».\r\nХристианско-демократические течения ратуют за\r\nсохранение культурной идентичности и «чистоты»\r\nнравов, противостоя чуждым, по их мнению, вея-\r\nниям — атеизму, космополитизму и радикальным\r\nидеям. Они ищут баланс между свободой личности\r\nи долгом перед Богом и обществом, предлагая\r\nмодель, где вера и разум сосуществуют в гармонии."

