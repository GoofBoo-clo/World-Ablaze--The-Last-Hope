state_lore_text_container_state_name_short_1339:0 "Москва"
state_lore_text_container_state_name_1339:0 "§YГород историй и контрастов§!:"
state_lore_text_container_state_description_1339:0 "\n\n\n\n\n\n£GFX_Moscow_state_lore\n\n\n\n\n\n\n                                                        §R«Ядерный взрыв»§! \n\nОсторожно, двери закрываются. - Московский метрополитен\n\nКремлевские стены, когда-то бастионы могущества, теперь лишь скорбные остовы, пронзенные радиацией и вечной мерзлотой. Москва, сердце бывшей России, ныне – город-призрак, погребенный под слоем ядерного пепла и горьких воспоминаний. Здесь, в 2022 году, завершилась Третья мировая, и с ней – эпоха. \n\nНа поверхности, где когда-то кипела жизнь, теперь лишь мертвая тишина и радиационный фон, убивающий все живое. Но глубоко под землей, в лабиринтах Московского метрополитена,теплится последняя искра человечества. Примерно  §Oпятнадцать тысяч душ§! нашли убежище в бесконечных туннелях и станциях, превратив их в свои последние крепости. \n\nО былой суете Арбата напоминают лишь скелеты сгоревших ларьков и обветшалые вывески, что раскачиваются на ветру, словно прощальный шепот. Пустые глазницы окон высоток глядят на опустевшие проспекты, где теперь лишь ветер гоняет обрывки газет и пыль. Каждый камень здесь пропитан отчаянием, каждый вздох – горечью утраты. \n\nМосквичи, или то, что от них осталось, влачат жалкое существование в полуразрушенных станциях и тоннелях. Радиация пропитала воздух, землю, даже души. Улыбка стала редким гостем на лицах, и даже привычная московская спешка уступила место медленному, обреченному шагу по темным, сырым переходам. В их глазах – боль, усталость и немой вопрос: "Зачем?". \n\nНо даже в этом аду, среди руин и отчаяния, теплится искра московского духа. Где-то в глубине подземных катакомб, под обломками метрополитена, еще звучит старая блатная песня, а изредка, на обломках когда-то величественного ГУМа, который теперь лишь смутный призрак над головой, можно заметить, как кто-то пытается продать последние "трофеи" из разграбленных магазинов. Вечная московская смекалка, стремление к "достатку" любой ценой, пусть и в мире, где само понятие достатка умерло – это и есть их проклятие и последняя надежда. Вдали, над городом, виднеются силуэты башен Москва-Сити, которые стали символом не только былой амбиции, но и грандиозного краха. И каждое утро, когда радиоактивный туман рассеивается над поверхностью, те, кто осмеливается подняться на разведку, видят их, напоминающие о том, что было, и о том, что никогда уже не будет. \n\nЭто Москва – город, который помнит, скорбит и ждет конца. Или ожидает начала чего-то нового, еще более ужасного, скрываясь в своих подземных норах.[eaw_state_lore_75_addendum]"
state_lore_text_container_state_description_1339_addendum:0 "\n£line_break\n\nПосле поражения Эквестрии в §RВеликой войне§!, восточное побережье оказалось под контролем победоносной Гегемонии Чейнджлингов. В §Y[?MAN.MAN_WS_GetFormDate]§! году §GКоролева Кризалис§! передала управление восточным побережьем и регионом вокруг Мейнхеттена военному протекторату.\n\nПосле прибытия §Cледи-протектора Лилак§! в город, §Gадминистрация чейнджлингов§! реквизировала здание Кристаллер — самый высокий небоскреб во всей Эквестрии - и превратила его в штаб-квартиру нового режима, а шуцбатайоны гарнизона заняли казармы и военные базы, которые ранее использовала эквестрийская армия.\n"

##############
#### KYIV ####
##############
state_lore_text_container_state_name_short_1285:0 "Киев"
state_lore_text_container_state_name_1285:0 "§YГород, который помнит — Киев§!:"
state_lore_text_container_state_description_1285:0 "\n\n\n\n\n\n£GFX_Kyiv_state_lore\n\n\n\n\n\n\n                                                        §Rредакт§!\n\n«Когда земля перестала петь, мы остались только с эхом. А эхо — оно не спасает от голода.» — вырезка из дневника неизвестного, найденного в руинах университета им. Шевченко, 2029 год.\n\nКогда в 2022 году ядерные грибы поднялись над столицами мира, Киев не стал исключением. Местом, где встретились стратегическая важность и забытая человечностью ярость. Тепловая волна прошла, войска исчезли, спутники ослепли — и только город остался, словно труп, который не хотят хоронить. Ныне §YКиев — это не столица, а укрытие.§! Руины былого величия, заваленные обломками панельных монстров, в которых еще теплится жизнь. Грязная, сломанная, но цепляющаяся за каждый клочок традиций. Остатки выживших построили общину, или точнее — иллюзию порядка, называя себя «Народной Радой Киева». В действительности — это совет из уцелевших командиров, бывших офицеров и отчаявшихся интеллигентов, что мечтают возродить украинскую культуру сквозь пепел. Тут чтят не флаг, а символы: вышиванку, спрятанную под противогазом; глиняную миску с заплесневелыми остатками борща; заученный наизусть «Заповіт.» Здесь даже радиационные дозиметры иногда хранятся в старых вышитых рушниках — не от функциональности, а от тоски. Но эта "культура" — лишь тонкая плёнка на фоне мародёров с Востока, сектантов из зон отчуждения и полураспавшихся отрядов бывших армий, что приходят с мечтой стереть Киев с лица земли окончательно. Гуманитарных грузов нет. Союзников — тоже. Только самодельные молотовы, ржавые АК и народные песни под землей. Каждый вечер кто-то включает старый радиопередатчик, выкрикивая в пустоту: «Київ тримається. Україна — жива. Якщо ви нас чуєте — ми ще тут.» Но никто не отвечает.