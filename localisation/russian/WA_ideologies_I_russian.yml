l_russian:

########################################
#              DEMOCRACY               #
########################################

democracy: "Демократия"
democracy_noun: "Демократия"
democracy_desc: "Демократический"

######################
#    SUBIDEOLOGIES   #
######################

centrism: "Центризм"
solidarism: "Солидаризм"
social_democracy: "Социал-Демократия"
democracy_socialism: "Демократический Социализм"
christian_democracy: "Христианская Демократия"

centrism_desc: "Центризм — это идеология, стремящаяся занять срединную позицию между крайностями, отвергая как слепой радикализм, так и застывший консерватизм. Она выступает за сбалансированный подход, где компромисс становится инструментом управления обществом, а не слабостью. Центристы желают видеть смешанную экономику, сочетая рыночные механизмы с умеренным вмешательством государства. Их взгляд на мир строится на убеждении, что стабильность и постепенные изменения предпочтительнее резких скачков, а разнообразие мнений укрепляет социум, а не разрушает его.\n\n    Критики же считают, что такая позиция часто лишена твердой основы, превращаясь в беспринципное следование за большинством, а стремление угодить всем оборачивается утратой четкой идентичности и неспособностью решать глубокие конфликты."
solidarism_desc: "Солидаризм — это приверженность идее единства общества, где гармония между классами и группами воспринимается как незыблемая истина, превосходящая индивидуальные амбиции. Сторонники солидаризма стремятся к повсеместному внедрению этого принципа во все сферы жизни, от экономики до морали, утверждая, что только через взаимопомощь и сотрудничество можно достичь подлинного процветания. Они желают видеть кооперативную экономику, основанную на коллективной ответственности. Взгляд на мир строится на возвращении к идеализированному состоянию, где эгоизм уступает общему благу, а социальная справедливость становится высшей целью. Противники же видят в этом утопию, маскирующую подавление свободы под лозунгом единства, и указывают на риск растворения личности в навязанной «общности»."
social_democracy_desc: "Социал-демократия — это идеология, стремящаяся примирить идеалы равенства и свободы через реформирование общества, избегая революционных потрясений. Она выступает за сильное государство, которое регулирует экономику и обеспечивает социальную справедливость, защищая права трудящихся и слабых. Социал-демократы желают видеть регулируемую экономику, где рынок служит обществу, а не диктует ему условия. Их взгляд на мир основан на вере в прогресс через сотрудничество классов и постепенное улучшение жизни для всех. Однако противники считают, что эта система чрезмерно полагается на бюрократию, подавляя индивидуальную инициативу, и часто жертвует эффективностью ради популистских мер. Критики также указывают, что стремление к равенству может обернуться уравниловкой, подрывающей личные достижения и амбиции."
democracy_socialism_desc: "Демократический социализм — идеология, что мечтает о равенстве через мягкую революцию, где власть народа и социальная справедливость идут рука об руку. Это не топор радикалов, а скальпель реформ, стремящийся укротить капитализм, сохранив свободу. Его адепты верят в государство как стража общего блага: бесплатные медицина и образование, защита труда — их знамёна. Корни тянутся к Марксу, но без его суровости, смешиваясь с либеральным духом. Критики ворчат о наивности, о риске бюрократии и удушения рынка. Сторонники же видят «разрушительное творчество» в сломе старых цепей неравенства. Это не монолитный путь, а пёстрая ткань идей: от умеренных скандинавских моделей до яростных левых голосов. Демократический социализм — надежда одних и утопия других, баланс между мечтой и реальностью. Обобщать трудно: он живёт в спорах и компромиссах.
christian_democracy_desc: "Христианская демократия — это приверженность к ценностям, основанным на христианской вере итрадициях, считаемых незыблемыми и вечными. Эти принципы применяются партиями и группами, стремящимися внедрить их в политику и социум. Главный мотив — возврат к моральному порядку, утраченному в эпоху секуляризации и либерализма, через защиту семьи, веры и общественной справедливости в их понимании «истинного пути». Христианско-демократические течения ратуют за сохранение культурной идентичности и «чистоты» нравов, противостоя чуждым, по их мнению, веяниям — атеизму, космополитизму и радикальным идеям. Они ищут баланс между свободой личности и долгом перед Богом и обществом, предлагая модель, где вера и разум сосуществуют в гармонии."

########################################
#                 NAZI                 #
########################################

nazi: "Национал-Социализм"
nazi_noun: "Национал-Социализм"
nazi_desc: "Тоталитарный, рассовая теория"

######################
#    SUBIDEOLOGIES   #
######################

nazi_subtype: "Нацизм"

nazi_subtype_desc: "Нацизм - это ядовитое варево из возрожденного фашистского пыла и безумного расового превосходства, боготворящее искаженное видение арийской чистоты превыше всего. Движимые бешеной ненавистью к евреям, меньшинствам и «дегенератам», они стремятся очистить общество от «неполноценных» элементов с помощью насилия и запугивания. Неонацисты фетишизируют милитаризм и авторитарный контроль, мечтая о тоталитарном государстве, где инакомыслие подавляется и господствует «главная раса». Они цепляются за искаженную историю, прославляя Третий рейх и раздувая конспирологическую пропаганду для подпитки своего дела. Свастика становится их нечестивым знаменем, а грубая сила - их евангелием. Критики называют её ненормальным реликтом, процветающим на паранойе и расколе, а ее последователи наслаждаются хаосом, преследуя бредовую утопию, построенную на крови и руинах."

########################################
#              CONSERVATISM            #
########################################

conservatism: "Консерватизм"
conservatism_noun: "Консерватизм"
conservatism_desc: "Демократический"

######################
#    SUBIDEOLOGIES   #
######################

conservatism_subtype: "Консерватизм"
neoconservatism: "Неоконсерватизм"
traditionalism: "Традиционализм"
liberal_conservatism: "Либеральный Консерватизм"
teocracy: "Теократия"
statism: "Статизм"

conservatism_subtype_desc: "Консерватизм — это идеология, ценящая стабильность, традиции и постепенные изменения вместо радикальных реформ. Консерваторы считают, что общество должно опираться на проверенные временем институты — семью, религию, государство, — которые обеспечивают порядок и мораль. Они скептически относятся к утопиям и абстрактным теориям, предпочитая прагматизм и сохранение существующего. Экономически консерватизм может поддерживать свободный рынок, но с акцентом на защиту национальных интересов. Социально он часто выступает за сохранение культурной идентичности и против быстрой модернизации. Мыслители вроде Эдмунда Бёрка подчеркивали важность эволюционного развития.\n\n	  Критики видят в консерватизме сопротивление прогрессу, а сторонники — защиту от хаоса и утраты ценностей."
neoconservatism_desc: "Неоконсерватизм — это идеология, возникшая в XX веке, сочетающая консервативные ценности с активной внешней политикой и верой в распространение демократии. Неоконсерваторы выступают за сильное государство, способное защищать национальные интересы и продвигать либеральные идеалы за рубежом, нередко через военное вмешательство. Они поддерживают свободный рынок, но допускают вмешательство государства для обеспечения стабильности. Идеология отвергает изоляционизм, считая, что мир и безопасность требуют глобального лидерства, особенно со стороны США. 	Неоконсерваторы часто критикуют мультикультурализм и подчеркивают важность традиционных ценностей, таких как семья и мораль. Их подход сочетает прагматизм с идеализмом, что вызывает споры: сторонники видят в этом силу, противники — агрессию и утопизм."
traditionalism_desc: "Традиционализм — это идеология, основанная на почитании прошлого, традиций и устоев как источника мудрости и стабильности. Традиционалисты считают, что современность с её прогрессом, индивидуализмом и секуляризацией разрушает проверенные временем ценности: семью, религию, общинность. Они выступают за сохранение иерархий, авторитетов и культурного наследия, часто идеализируя доиндустриальное общество. Традиционализм отвергает либеральные идеи равенства и перемен ради самих перемен, видя в них угрозу порядку. Философы вроде Рене Генона и Юлиуса Эволы связывали его с метафизическими принципами и духовностью.\n\n	  Критики обвиняют традиционализм в ретроградности и неспособности адаптироваться, тогда как сторонники видят в нём защиту от хаоса современности."
liberal_conservatism_desc: "Либеральный консерватизм — это идеология, сочетающая либеральные и консервативные принципы, стремясь к балансу между свободой и традициями. Она поддерживает индивидуальные права, рыночную экономику и ограниченное государство — черты либерализма, — но при этом ценит стабильность, моральные устои и культурное наследие, характерные для консерватизма. Либерал-консерваторы выступают за постепенные реформы, избегая радикализма, и считают, что свобода должна сопровождаться ответственностью и уважением к порядку. Эта идеология часто ассоциируется с умеренными политическими партиями, такими как британские тори XIX века.\n\n      Критики обвиняют её в непоследовательности или компромиссности, а сторонники видят в ней разумный синтез, позволяющий адаптироваться к современности без утраты корней."
teocracy_desc: "Теократия — это идеология и форма правления, при которой власть принадлежит религиозным лидерам, а государственные законы основаны на священных текстах или божественных заповедях. Теократы считают, что общество должно жить по воле Бога, интерпретируемой духовенством, а светская власть подчинена религиозной. Эта система отвергает разделение церкви и государства, видя в религии источник морали и порядка. Примеры — исторические папские государства или современный Иран с его исламской республикой. Теократия подчеркивает духовное единство, но часто ограничивает личные свободы и плюрализм, требуя подчинения догмам.\n\n      Критики считают её репрессивной и устаревшей, тогда как сторонники видят в ней путь к праведной жизни и защите от секулярного упадка."
statism_desc: "Статизм — это идеология, утверждающая главенство государства над всеми аспектами жизни общества. Она считает государство высшим авторитетом, ответственным за регулирование экономики, культуры, образования и даже личных свобод ради общего блага или национальных целей. Статисты видят в сильной централизованной власти способ обеспечить порядок, безопасность и прогресс, отвергая чрезмерный индивидуализм или рыночный хаос. Граждане воспринимаются как часть коллективного организма, подчиненного интересам государства. Идеология может сочетаться с разными системами — от социализма до авторитаризма. Критики обвиняют статизм в удушении свобод и создании бюрократии, приводящей к неэффективности. Сторонники считают его необходимым для защиты общества от распада и внешних угроз в эпоху нестабильности."

########################################
#               DESPOTISM              #
########################################

despotism: "Деспотизм"
despotism_noun: "Деспотизм"
despotism_desc: "Тоталитарный"

######################
#    SUBIDEOLOGIES   #
######################

despotism_subtype: "Деспотизм"
totalism: "Тотализм"
fundamentalism: "Фундаментализм"

despotism_subtype_desc: "Деспотизм — это идеология и форма правления, при которой власть одного лица или группы осуществляется произвольно, без оглядки на законы или волю народа. Она характеризуется абсолютным подчинением общества правителю, чья воля становится единственным источником решений. Деспотизм подавляет свободы, используя страх, насилие и подкуп для поддержания контроля. Экономика и ресурсы часто служат обогащению элиты, а не благу общества. Идеология может опираться на традицию, религию или миф о необходимости сильной руки для порядка. Отличие от других ав торитарных систем — в отсутствии даже формальных ограничений власти.\n\n     Критики видят в деспотизме тиранию и несправедливость, тогда как сторонники считают его способом избежать анархии и обеспечить единство в сложные времена."
totalism_desc: "Тотализм — это яростная доктрина, где государство становится всепоглощающей силой, подавляющей личную волю ради единства и мощи. Здесь нет места слабости: контроль пронизывает все — от умов до тел, возводя порядок в абсолют. Тоталисты жаждут централизованной экономики, где ресурсы служат величию системы, а не индивиду. Их взгляд на мир — поле битвы, где только сильнейшие выживают, а инакомыслие выжигается как зараза. Они воспевают прошлое, когда железная рука правила без оглядки, и презирают «разложение» свобод. Армия и пропаганда — их оружие для построения монолита, где каждый — винтик машины. Движимые мечтой о вечной власти, они клеймят врагов как угрозу делу, но критики видят в этом лишь тиранию, где человек растворяется в безликой массе, а жизнь — в служении идолу государства."
fundamentalism_desc: "Фундаментализм — это приверженность к комплексу идей и ценностей, воспринимаемых как незыблемые и являющиеся абсолютной истиной вне зависимости от их содержания. Эти принципы используются социальными группами и движениями, которые называются фундаменталистскими, стремящихся к повсеместному распространению во всех сферах социума, включая политику. Основополагающим мотивом фундаментализма является стремление к возвращению в некое  изначальное «правильное» состояние, восстановлению «утраченной подлинности» культуры или уклада, в той интерпретации, в которой представляет это изначальное положение конкретное течение. Фундаменталистскими являются течения мысли, религиозные и светские, ратующие за «чистоту» своих идей и политических планов, их «защиту» от возникших в ходе истории «чуждых», в их понимании, элементов."

